# Example inventory for Linux Conf Doctor.
# The audit is read-only; it only reads /proc, /sys, and config files.

[local]
localhost ansible_connection=local

[servers]
# Resolves via ~/.ssh/config (Host node3 -> root@167.235.119.179).
node3 ansible_user=root
# Add more hosts to audit over SSH, e.g.:
# web01 ansible_host=10.0.0.5 ansible_user=admin
# db01  ansible_host=10.0.0.6 ansible_user=admin

# Reading some config files (postgresql.conf, systemd unit limits) may need
# privilege escalation. Run with -e doctor_become=true (and -K) when required.

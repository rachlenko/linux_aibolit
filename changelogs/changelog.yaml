---
ancestor: null
releases:
  1.0.1:
    release_date: "2026-06-02"
    changes:
      bugfixes:
        - Correct the repository, documentation, homepage and issues URLs in
          galaxy.yml to point at github.com/rachlenko/linux_aibolit (the previous
          links pointed at a non-existent doctor-linux-aibolit repository).
      minor_changes:
        - Expand build_ignore to keep local development and cache directories
          (.ansible, .cache, .pytest_cache, dist, changelogs/.plugin-cache.yaml)
          out of the published artifact.
  1.0.0:
    release_date: "2026-06-02"
    changes:
      release_summary: >-
        Initial public release of the rachlenko.linux_aibolit collection. Ships
        the read-only doctor audit role with a declarative catalog rule
        engine (max / min / equals / in_set / bool / info), system modules
        (kernel, network, storage, filesystem, cpu, perftune, limits) and opt-in
        component modules (postgres, mysql, oracle, ceph). Renders a colour-coded
        HTML report per host on the control node and never mutates the target.
